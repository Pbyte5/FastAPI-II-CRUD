[project]
name = "fastapi-ii"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lians", email = "paterninalopezlians@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.54",
    "sqlmodel>=0.0.46",
    "uvicorn>=0.53.0",
]

[tool.setuptools.packages.find]
where = ["."]
[tool.uv]
package = false
[project.scripts]
fastapi-ii = "fastapi_ii:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
